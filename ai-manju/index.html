<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI漫剧整本生产线</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="control-panel" aria-label="整本小说生产设置">
        <header class="brand">
          <div>
            <p class="eyebrow">Novel To AI Manju</p>
            <h1>AI漫剧整本生产线</h1>
          </div>
          <span class="local-badge">整本</span>
        </header>

        <figure class="cover-shot">
          <img src="assets/studio-cover.png" alt="手稿转为分镜和视频时间线的创作台">
        </figure>

        <form id="storyForm" class="form-stack">
          <label class="field">
            <span>小说标题</span>
            <input id="titleInput" type="text" autocomplete="off" placeholder="例如：雾港来信">
          </label>

          <label class="field">
            <span>整本小说正文</span>
            <textarea id="novelInput" placeholder="直接粘贴整部小说。系统会识别章节；没有章节标题时会按段落和字数自动拆集。"></textarea>
          </label>

          <div class="form-grid">
            <label class="field">
              <span>目标集数</span>
              <input id="episodeCountInput" type="number" min="0" max="200" value="0">
            </label>

            <label class="field">
              <span>每集目标字数</span>
              <input id="charsPerEpisodeInput" type="number" min="800" max="12000" step="100" value="3000">
            </label>

            <label class="field">
              <span>单集分钟</span>
              <input id="minutesPerEpisodeInput" type="number" min="1" max="20" value="3">
            </label>

            <label class="field">
              <span>每集镜头</span>
              <input id="shotsPerEpisodeInput" type="number" min="4" max="16" value="8">
            </label>

            <label class="field">
              <span>类型</span>
              <select id="genreInput">
                <option value="悬疑">悬疑</option>
                <option value="科幻">科幻</option>
                <option value="奇幻">奇幻</option>
                <option value="都市">都市</option>
                <option value="爱情">爱情</option>
                <option value="武侠">武侠</option>
                <option value="历史">历史</option>
                <option value="现实主义">现实主义</option>
              </select>
            </label>

            <label class="field">
              <span>漫剧画风</span>
              <select id="styleInput">
                <option value="manju">国漫漫剧</option>
                <option value="cinematic">电影感写实</option>
                <option value="anime">高质感动画</option>
                <option value="noir">黑色悬疑</option>
                <option value="wuxia">东方武侠</option>
                <option value="future">近未来科幻</option>
              </select>
            </label>

            <label class="field">
              <span>画幅</span>
              <select id="aspectInput">
                <option value="9:16">9:16 竖屏</option>
                <option value="16:9">16:9 横屏</option>
                <option value="1:1">1:1 方屏</option>
                <option value="2.39:1">2.39:1 宽银幕</option>
              </select>
            </label>

            <label class="field">
              <span>节奏</span>
              <select id="toneInput">
                <option value="AI漫剧爽感">AI漫剧爽感</option>
                <option value="短剧强钩子">短剧强钩子</option>
                <option value="院线电影">院线电影</option>
                <option value="预告片">预告片</option>
                <option value="分集网剧">分集网剧</option>
              </select>
            </label>
          </div>

          <label class="field">
            <span>额外要求</span>
            <input id="notesInput" type="text" autocomplete="off" placeholder="角色设定、禁忌画面、平台规格、旁白风格">
          </label>

          <div class="hint-line">目标集数填 0 表示自动估算。</div>

          <div class="action-row">
            <button class="primary-action" type="submit">一键拆书生产</button>
            <button type="button" id="sampleButton">示例</button>
            <button type="button" id="clearButton">清空</button>
          </div>

          <section class="provider-box" aria-label="ChatGPT 改编设置">
            <div class="provider-head">
              <div>
                <p class="eyebrow">ChatGPT Writer</p>
                <h2>ChatGPT改编</h2>
              </div>
              <span id="chatgptStatus" class="status-pill">检测中</span>
            </div>
            <label class="check-row">
              <input id="useChatgptToggle" type="checkbox" checked>
              <span>生成整部前先让 ChatGPT 拆书、写剧本和提示词</span>
            </label>
            <button type="button" id="startChatgptButton">ChatGPT智能改编</button>
            <div id="chatgptHint" class="hint-line">需要本地后端和 OPENAI_API_KEY。</div>
          </section>

          <section class="provider-box" aria-label="即梦生成设置">
            <div class="provider-head">
              <div>
                <p class="eyebrow">Jimeng / Ark</p>
                <h2>即梦直出</h2>
              </div>
              <span id="providerStatus" class="status-pill">检测中</span>
            </div>
            <label class="check-row">
              <input id="renderAllToggle" type="checkbox" checked>
              <span>生成整部：所有集、所有镜头</span>
            </label>
            <label class="check-row">
              <input id="assembleToggle" type="checkbox" checked>
              <span>生成后尝试自动拼接成片</span>
            </label>
            <label class="check-row">
              <input id="dryRunToggle" type="checkbox">
              <span>模拟生成：不调用API，先演练整部流水线</span>
            </label>
            <label class="field">
              <span>失败自动重试</span>
              <input id="retryAttemptsInput" type="number" min="0" max="3" value="1">
            </label>
            <button type="button" id="startRenderButton" class="primary-action">生成整部AI漫剧</button>
            <div id="providerHint" class="hint-line">需要本地后端和 ARK_API_KEY。</div>
          </section>
        </form>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <div>
            <p id="metaLine" class="eyebrow">等待整本小说</p>
            <h2 id="projectTitle">AI漫剧成果预览</h2>
          </div>

          <div class="tool-row" aria-label="输出工具">
            <button type="button" id="copyAllButton" title="复制全集生产包">⎘ 全集</button>
            <button type="button" id="exportMdButton" title="导出 Markdown">⇩ MD</button>
            <button type="button" id="exportJsonButton" title="导出 JSON">⇩ JSON</button>
            <a class="button-link" href="https://chatgpt.com/" target="_blank" rel="noopener" title="打开 ChatGPT">↗ ChatGPT</a>
          </div>
        </header>

        <nav class="tabs" aria-label="生产包内容">
          <button class="tab-button active" type="button" data-tab="overview">总控</button>
          <button class="tab-button" type="button" data-tab="episodes">拆集</button>
          <button class="tab-button" type="button" data-tab="script">剧本</button>
          <button class="tab-button" type="button" data-tab="storyboard">分镜</button>
          <button class="tab-button" type="button" data-tab="image">图片</button>
          <button class="tab-button" type="button" data-tab="video">视频</button>
          <button class="tab-button" type="button" data-tab="adapt">ChatGPT改编</button>
          <button class="tab-button" type="button" data-tab="render">即梦生成</button>
          <button class="tab-button" type="button" data-tab="qc">验收</button>
          <button class="tab-button" type="button" data-tab="master">主控提示词</button>
        </nav>

        <section id="emptyState" class="empty-state">
          <div class="empty-copy">
            <p class="eyebrow">Full Pipeline</p>
            <h3>整本小说 → 自动拆集 → 漫剧剧本 → 分镜提示词 → 图生视频 → 成片验收</h3>
          </div>
        </section>

        <section id="outputState" class="output-state hidden" aria-live="polite">
          <div class="episode-toolbar">
            <label class="field compact-field">
              <span>当前生产集</span>
              <select id="episodeSelect"></select>
            </label>
            <div class="episode-actions">
              <button type="button" data-copy-key="episode" data-copy-label="已复制当前集生产包">⎘ 当前集</button>
              <button type="button" data-copy-key="episode-image" data-copy-label="已复制当前集图片提示词">⎘ 当前集图片</button>
              <button type="button" data-copy-key="episode-video" data-copy-label="已复制当前集视频提示词">⎘ 当前集视频</button>
            </div>
          </div>

          <article id="panel-overview" class="tab-panel active" data-panel="overview"></article>
          <article id="panel-episodes" class="tab-panel" data-panel="episodes"></article>
          <article id="panel-script" class="tab-panel" data-panel="script"></article>
          <article id="panel-storyboard" class="tab-panel" data-panel="storyboard"></article>
          <article id="panel-image" class="tab-panel" data-panel="image"></article>
          <article id="panel-video" class="tab-panel" data-panel="video"></article>
          <article id="panel-adapt" class="tab-panel" data-panel="adapt"></article>
          <article id="panel-render" class="tab-panel" data-panel="render"></article>
          <article id="panel-qc" class="tab-panel" data-panel="qc"></article>
          <article id="panel-master" class="tab-panel" data-panel="master"></article>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
